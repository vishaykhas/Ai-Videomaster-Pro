    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              impact: ['Impact', 'sans-serif'],
              marker: ['"Permanent Marker"', 'cursive'],
              comic: ['Bangers', 'cursive'],
            },
            colors: {
              brand: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
              },
              // Mapped to CSS Variables for Theming
              dark: {
                800: 'var(--bg-card)',     // Cards / Panels
                900: 'var(--bg-surface)',  // Sidebar / Inputs
                950: 'var(--bg-base)',     // Main Background
                700: 'var(--bg-hover)',    // Hover states
              },
              gray: {
                 800: 'var(--border-color)',
                 700: 'var(--border-color-strong)',
                 // Keep standard grays for things that shouldn't change heavily
                 600: '#4b5563',
                 500: '#6b7280',
                 400: '#9ca3af',
                 300: '#d1d5db',
              },
              // Semantic Text Colors
              theme: {
                 base: 'var(--text-main)',
                 muted: 'var(--text-sub)',
                 inverted: 'var(--text-inverted)',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* DARK MODE (Default) */
        --bg-base: #020617;    /* dark-950 */
        --bg-surface: #0f172a; /* dark-900 */
        --bg-card: #1e293b;    /* dark-800 */
        --bg-hover: #334155;   /* dark-700 */
        
        --text-main: #ffffff;
        --text-sub: #9ca3af;   /* gray-400 */
        --text-inverted: #020617;

        --border-color: #1f2937;        /* gray-800 */
        --border-color-strong: #374151; /* gray-700 */
      }

      html.light-mode {
        /* LIGHT MODE */
        --bg-base: #f1f5f9;    /* slate-100 */
        --bg-surface: #ffffff; /* white */
        --bg-card: #ffffff;    /* white */
        --bg-hover: #e2e8f0;   /* slate-200 */

        --text-main: #0f172a;  /* slate-900 */
        --text-sub: #64748b;   /* slate-500 */
        --text-inverted: #ffffff;

        --border-color: #e2e8f0;        /* slate-200 */
        --border-color-strong: #cbd5e1; /* slate-300 */
      }

      body {
        background-color: var(--bg-base);
        color: var(--text-main);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* Transitions for theme changes */
      .transition-colors, .transition-all {
        transition-property: all;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 300ms;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-surface); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color-strong); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
    </style>
